name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No dependencies and no lockfile, so no install step and no npm cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
